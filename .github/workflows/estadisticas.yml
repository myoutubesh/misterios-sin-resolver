name: Estadísticas y panel

on:
  schedule:
    - cron: "0 11 * * *"   # todos los días, 5:00 en CDMX
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-del-canal
  cancel-in-progress: false

jobs:
  estadisticas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Actualizar estadísticas, aprendizajes y panel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO || 'claude-opus-5-5' }}
          CANAL_NOMBRE: ${{ vars.CANAL_NOMBRE || 'Misterios Sin Resolver' }}
        run: python -u -m pipeline.main estadisticas
      - name: Guardar
        if: always()
        run: |
          git config user.name "bot-misterios"
          git config user.email "bot-misterios@users.noreply.github.com"
          git add data docs PANEL.md
          git commit -m "Estadísticas $(date -u +%F)" || exit 0
          git pull --rebase -X theirs || true
          git push
