name: Shorts diarios

on:
  schedule:
    # Hora UTC. Costa Rica = UTC-6. Cada short se crea ~2.5 h antes y se sube programado para que YouTube
    # lo publique solo a las 7:00, 9:00, 12:00, 15:00, 18:00 y 21:00 de Costa Rica (variable
    # YT_HORA_PUBLICACION_SHORTS). 6 al día es el máximo de la cuota gratis de YouTube (~10,000 unidades;
    # cada subida gasta ~1,600). Los martes y viernes se salta el de las 21:00 para dejar lugar al video largo.
    - cron: "30 10 * * *"           # -> 7:00
    - cron: "30 12 * * *"           # -> 9:00
    - cron: "30 15 * * *"           # -> 12:00
    - cron: "30 18 * * *"           # -> 15:00
    - cron: "30 21 * * *"           # -> 18:00
    - cron: "30 0 * * 0,1,2,4,5"    # -> 21:00 (no corre la noche de martes ni viernes)
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema opcional (título de Wikipedia en inglés)"
        required: false
      subir:
        description: "¿Subir a YouTube?"
        type: boolean
        default: true
      publicar_ya:
        description: "Publicar apenas se suba (sin esperar los horarios)"
        type: boolean
        default: false
      esperar_cuota:
        description: "Esperar a que YouTube reinicie la cuota diaria (08:05 UTC = 2:05 Costa Rica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: datos-del-canal   # nunca corren dos trabajos a la vez (evita conflictos y duplicados)
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Esperar reinicio de cuota de YouTube
        if: github.event.inputs.esperar_cuota == 'true'
        timeout-minutes: 290
        run: |
          objetivo=$(date -u -d "08:05" +%s); ahora=$(date -u +%s)
          if [ $objetivo -le $ahora ] && [ $((ahora - objetivo)) -gt 3600 ]; then objetivo=$(date -u -d "tomorrow 08:05" +%s); fi
          if [ $objetivo -gt $ahora ]; then echo "Espero $(( (objetivo - ahora) / 60 )) min"; sleep $((objetivo - ahora)); fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg y dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Crear y publicar el short (con un reintento)
        timeout-minutes: 60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CLAUDE_MODELO: ${{ vars.CLAUDE_MODELO || 'claude-opus-5-5' }}
          YT_PRIVACIDAD: ${{ github.event.inputs.publicar_ya == 'true' && 'public' || vars.YT_PRIVACIDAD || 'public' }}
          YT_HORA_PUBLICACION: ${{ github.event.inputs.publicar_ya != 'true' && vars.YT_HORA_PUBLICACION_SHORTS || '' }}
          ZONA_HORARIA: ${{ vars.ZONA_HORARIA || 'America/Costa_Rica' }}
          REDDIT_PROB: ${{ vars.REDDIT_PROB || '0.4' }}
          CANAL_NOMBRE: ${{ vars.CANAL_NOMBRE || 'Misterios Sin Resolver' }}
          TEMA: ${{ github.event.inputs.tema }}
          SUBIR: ${{ github.event.inputs.subir }}
        run: |
          ARGS=(short)
          if [ -n "$TEMA" ]; then ARGS+=(--tema "$TEMA"); fi
          if [ "$SUBIR" = "false" ]; then ARGS+=(--no-subir); fi
          if ! python -u -m pipeline.main "${ARGS[@]}"; then
            if [ -f out/SUBIDO ]; then echo "El video ya se subió; no reintento."; exit 1; fi
            echo "Falló; reintento en 2 minutos…"; sleep 120
            python -u -m pipeline.main "${ARGS[@]}"
          fi

      - name: Guardar video como artefacto (7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            out/*/short.mp4
            out/*/meta.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar registros y panel
        if: always()
        run: |
          git config user.name "bot-misterios"
          git config user.email "bot-misterios@users.noreply.github.com"
          git add data docs PANEL.md
          git commit -m "Short: registros $(date -u +%F_%H%M)" || exit 0
          git pull --rebase -X theirs || true
          git push
